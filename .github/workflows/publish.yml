name: Publish packages to GitHub Packages
on:
  push:
    branches: [ "main", "20.0.x" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@termx-health'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Publish each built package only if its exact version is not already on the registry.
      # This is idempotent: re-runs publish nothing new, and bumping a single package's
      # version publishes just that one (no dependency on which files "changed").
      - name: Publish new package versions
        run: |
          set -euo pipefail
          publish_if_new() {
            local dir="dist/$1"
            if [ ! -f "$dir/package.json" ]; then
              echo "::warning::$1 was not built ($dir/package.json missing), skipping"
              return
            fi
            local name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "= $name@$version already published — skipping"
            else
              echo "+ publishing $name@$version"
              (cd "$dir" && npm publish)
            fi
          }
          publish_if_new core-util
          publish_if_new util
          publish_if_new ui
          publish_if_new markdown-parser
          publish_if_new markdown
          publish_if_new quill
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
